name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: HeatLoad-win-x64
          - os: ubuntu-latest
            rid: linux-x64
            artifact: HeatLoad-linux-x64
          - os: macos-latest
            rid: osx-arm64
            artifact: HeatLoad-macos-arm64
          - os: macos-13
            rid: osx-x64
            artifact: HeatLoad-macos-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >
          dotnet publish HeatLoad.App/HeatLoad.App.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:SatelliteResourceLanguages=en -p:DebugType=None -p:DebugSymbols=false
          -o out/${{ matrix.rid }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "out/${{ matrix.rid }}/*" -DestinationPath "HeatLoad-${{ matrix.rid }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x "out/${{ matrix.rid }}/HeatLoad"
          tar -czf "HeatLoad-${{ matrix.rid }}.tar.gz" -C "out/${{ matrix.rid }}" HeatLoad

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x "out/${{ matrix.rid }}/HeatLoad"
          mkdir -p "HeatLoad.app/Contents/MacOS"
          cp "out/${{ matrix.rid }}/HeatLoad" "HeatLoad.app/Contents/MacOS/HeatLoad"
          cp installer/HeatLoad.app.Info.plist "HeatLoad.app/Contents/Info.plist"
          tar -czf "HeatLoad-${{ matrix.rid }}.tar.gz" HeatLoad.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: HeatLoad-${{ matrix.rid }}.*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: HeatLoad-${{ matrix.rid }}.*
